[platformio]
default_envs = yd_esp32_s3

[env]
platform = espressif32 @ 6.11.0
board = esp32-s3-devkitc-1
framework = arduino

upload_speed = 921600

; Banned on V1 and V2 (see AGENTS.md): Wi-Fi, PSRAM/external flash, native USB.
; Keep USB CDC off; upload and logs go through UART0 only.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
build_src_flags =
    -Wall
    -Wextra
    -Werror=return-type
    -Wframe-larger-than=2048

[env:yd_esp32_s3]
monitor_speed = 57600
lib_deps =
    adafruit/Adafruit NeoPixel @ 1.15.5
build_src_filter =
    +<main.cpp>
    +<app/>
    +<hardware/>
    +<interrupts/>
    +<motor/>
    +<sensors/>
    +<communication/>
    +<system/>
    +<control/>
    -<sensor_serial_test.cpp>
    -<tests/>

[env:sensor_serial_test]
monitor_speed = 115200
build_src_filter =
    -<main.cpp>
    -<app/>
    -<hardware/>
    -<interrupts/>
    -<motor/>
    -<sensors/>
    -<communication/>
    -<system/>
    -<control/>
    +<sensors/color_sensor_manager.cpp>
    +<sensors/color_sensor_types.cpp>
    +<sensor_serial_test.cpp>

[env:yd_esp32_s3_tcs34725]
extends = env:yd_esp32_s3
build_flags =
    ${env.build_flags}
    -D COLOR_SENSOR_MODEL=2

[env:sensor_serial_test_tcs34725]
extends = env:sensor_serial_test
build_flags =
    ${env.build_flags}
    -D COLOR_SENSOR_MODEL=2

; Separate color calibration firmware. Upload, calibrate, CAL SAVE, then
; upload the production firmware again. Motors are never initialized.
[env:color_calibration]
monitor_speed = 57600
build_src_filter =
    -<*>
    +<calibration_main.cpp>
    +<calibration/>
    +<hardware/board_io.cpp>
    +<sensors/calibration_store.cpp>
    +<sensors/color_sensor_manager.cpp>
    +<sensors/color_sensor_types.cpp>

[env:color_calibration_tcs34725]
extends = env:color_calibration
build_flags =
    ${env.build_flags}
    -D COLOR_SENSOR_MODEL=2

[env:robot_bench]
extends = env:yd_esp32_s3
build_src_filter =
    ${env:yd_esp32_s3.build_src_filter}
    -<main.cpp>
    +<bench/>
    +<bench_main.cpp>

[env:robot_bench_tcs34725]
extends = env:robot_bench
build_flags =
    ${env.build_flags}
    -D COLOR_SENSOR_MODEL=2

; ---------------------------------------------------------------------------
; V2 board (HW_VERSION=2, pins_v2.hpp). Spectral sensors are AS7341-class.
; memory_type stays qio_qspi: octal PSRAM settings are banned (GPIO35 = EN_2).
; Not yet verified on an assembled V2 board.
[v2]
build_flags =
    ${env.build_flags}
    -D HW_VERSION=2

[env:yd_esp32_s3_v2]
extends = env:yd_esp32_s3
board_build.arduino.memory_type = qio_qspi
build_flags = ${v2.build_flags}

[env:robot_bench_v2]
extends = env:robot_bench
board_build.arduino.memory_type = qio_qspi
build_flags = ${v2.build_flags}

[env:sensor_serial_test_v2]
extends = env:sensor_serial_test
board_build.arduino.memory_type = qio_qspi
build_flags = ${v2.build_flags}

[env:color_calibration_v2]
extends = env:color_calibration
board_build.arduino.memory_type = qio_qspi
build_flags = ${v2.build_flags}
