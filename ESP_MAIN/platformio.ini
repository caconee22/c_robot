; V2 robot: two firmwares for the V2 board (HW_VERSION=2, pins_v2.hpp).
; Old V1 robot (11/10): yd_esp32_s3_v1_husky / robot_bench_v1_husky below.
; Retired environments (V1, TCS34725, old bench, sensor serial test,
; standalone color calibration) are kept in archive/platformio_full.ini — see archive/README.md.
[platformio]
default_envs = yd_esp32_s3_v2
; Windows ESP32 linker cannot write firmware.map under a Korean path.
build_dir = ${sysenv.USERPROFILE}/.platformio/build/c_robot_current

[env]
platform = espressif32 @ 6.11.0
board = esp32-s3-devkitc-1
framework = arduino

upload_speed = 921600
monitor_speed = 57600
; memory_type stays qio_qspi: octal PSRAM settings are banned (GPIO35 = EN_2).
board_build.arduino.memory_type = qio_qspi

; Banned on V1 and V2 (see AGENTS.md): Wi-Fi, PSRAM/external flash, native USB.
; Keep USB CDC off; upload and logs go through UART0 only.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D HW_VERSION=2
build_src_flags =
    -Wall
    -Wextra
    -Werror=return-type
    -Wframe-larger-than=2048

; Match firmware: drive FSM. 11/11: also holds the bench (tests + color
; calibration): power on with SW1 and SW2 held 1 s -> bench, otherwise match
; (src/app/boot_mode.cpp). robot_bench_v2_manual below stays as a bench-only build.
[env:yd_esp32_s3_v2]
lib_deps =
    adafruit/Adafruit NeoPixel @ 1.15.5
build_flags =
    ${env.build_flags}
    -D BENCH_SOFTWARE_SWITCHES=1
    -D COMBINED_BENCH=1
build_src_filter =
    -<*>
    +<main.cpp>
    +<app/>
    +<hardware/>
    +<interrupts/>
    +<motor/>
    +<sensors/>
    +<communication/>
    +<system/>
    +<control/>
    +<bench_v2/>
    +<bench/>
    +<calibration/>

; Bench: low-output manual tests, diagnostics and floor color calibration
; (PC side: tools/bench_gui.py).
[env:robot_bench_v2_manual]
lib_deps = ${env:yd_esp32_s3_v2.lib_deps}
build_flags =
    ${env.build_flags}
    -D BENCH_SOFTWARE_SWITCHES=1
build_src_filter =
    -<*>
    +<bench_v2_main.cpp>
    +<bench_v2/>
    +<bench/>
    +<calibration/>
    +<app/>
    +<hardware/>
    +<interrupts/>
    +<motor/>
    +<sensors/>
    +<communication/>
    +<system/>

; Old V1 sumo robot (11/10, sparring partner): V1 pins (pins.hpp), TCS34725
; floor sensors, HuskyLens on UART1 (115200) instead of the Raspberry Pi.
; No IMU, no battery input: the opening move runs as on a 4S pack (x1.0).
; Same FSM, motor trim and bench/calibration as the V2 robot.
[env:yd_esp32_s3_v1_husky]
lib_deps = ${env:yd_esp32_s3_v2.lib_deps}
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D HW_VERSION=1
    -D COLOR_SENSOR_MODEL=2
    -D VISION_HUSKYLENS=1
    -D BENCH_SOFTWARE_SWITCHES=1
    -D COMBINED_BENCH=1
build_src_filter = ${env:yd_esp32_s3_v2.build_src_filter}

[env:robot_bench_v1_husky]
lib_deps = ${env:yd_esp32_s3_v2.lib_deps}
build_flags =
    ${env:yd_esp32_s3_v1_husky.build_flags}
    -D BENCH_SOFTWARE_SWITCHES=1
build_src_filter = ${env:robot_bench_v2_manual.build_src_filter}

; Standalone diagnostic: motors remain disabled; UART0 prints I2C scans.
[env:i2c_scanner_v2]
upload_port = COM9
build_src_filter =
    -<*>
    +<i2c_scanner_main.cpp>
    +<hardware/board_io.cpp>

; Bare PWM diagnostic: auto-runs both motors at 20%. Cut motor power to stop.
[env:raw_motor_v2]
upload_port = COM9
build_src_filter =
    -<*>
    +<raw_motor_main.cpp>
