[platformio]
default_envs = yd_esp32_s3

[env]
platform = espressif32 @ 6.11.0
board = esp32-s3-devkitc-1
framework = arduino

upload_speed = 921600

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
build_src_flags =
    -Wall
    -Wextra
    -Werror=return-type
    -Wframe-larger-than=2048

[env:yd_esp32_s3]
monitor_speed = 57600
lib_deps =
    adafruit/Adafruit NeoPixel @ 1.15.5
build_src_filter =
    +<main.cpp>
    +<app/>
    +<hardware/>
    +<interrupts/>
    +<motor/>
    +<sensors/>
    +<communication/>
    +<system/>
    +<control/>
    -<sensor_serial_test.cpp>
    -<tests/>

[env:sensor_serial_test]
monitor_speed = 115200
build_src_filter =
    -<main.cpp>
    -<app/>
    -<hardware/>
    -<interrupts/>
    -<motor/>
    -<sensors/>
    -<communication/>
    -<system/>
    -<control/>
    +<sensors/color_sensor_manager.cpp>
    +<sensors/color_sensor_types.cpp>
    +<sensor_serial_test.cpp>

[env:yd_esp32_s3_tcs34725]
extends = env:yd_esp32_s3
build_flags =
    ${env.build_flags}
    -D COLOR_SENSOR_MODEL=2

[env:sensor_serial_test_tcs34725]
extends = env:sensor_serial_test
build_flags =
    ${env.build_flags}
    -D COLOR_SENSOR_MODEL=2

[env:robot_bench]
extends = env:yd_esp32_s3
build_src_filter =
    ${env:yd_esp32_s3.build_src_filter}
    -<main.cpp>
    +<bench/>
    +<bench_main.cpp>

[env:robot_bench_tcs34725]
extends = env:robot_bench
build_flags =
    ${env.build_flags}
    -D COLOR_SENSOR_MODEL=2
