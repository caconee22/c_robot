[platformio]
default_envs = yd_esp32_s3

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0

[env:yd_esp32_s3]
build_src_filter =
    +<main.cpp>
    -<sensor_serial_test.cpp>

[env:sensor_serial_test]
build_src_filter =
    -<main.cpp>
    +<sensor_serial_test.cpp>

lib_deps =
    adafruit/Adafruit AS7341
