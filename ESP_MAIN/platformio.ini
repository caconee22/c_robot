; Two firmwares, both for the V2 board (HW_VERSION=2, pins_v2.hpp).
; Retired environments (V1, TCS34725, old bench, sensor serial test,
; standalone color calibration) are kept in archive/platformio_full.ini — see archive/README.md.
[platformio]
default_envs = yd_esp32_s3_v2

[env]
platform = espressif32 @ 6.11.0
board = esp32-s3-devkitc-1
framework = arduino

upload_speed = 921600
monitor_speed = 57600
; memory_type stays qio_qspi: octal PSRAM settings are banned (GPIO35 = EN_2).
board_build.arduino.memory_type = qio_qspi

; Banned on V1 and V2 (see AGENTS.md): Wi-Fi, PSRAM/external flash, native USB.
; Keep USB CDC off; upload and logs go through UART0 only.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D HW_VERSION=2
build_src_flags =
    -Wall
    -Wextra
    -Werror=return-type
    -Wframe-larger-than=2048

; Match firmware: drive FSM.
[env:yd_esp32_s3_v2]
lib_deps =
    adafruit/Adafruit NeoPixel @ 1.15.5
build_src_filter =
    -<*>
    +<main.cpp>
    +<app/>
    +<hardware/>
    +<interrupts/>
    +<motor/>
    +<sensors/>
    +<communication/>
    +<system/>
    +<control/>

; Bench: low-output manual tests, diagnostics and floor color calibration
; (PC side: tools/bench_gui.py).
[env:robot_bench_v2_manual]
lib_deps = ${env:yd_esp32_s3_v2.lib_deps}
build_flags =
    ${env.build_flags}
    -D BENCH_SOFTWARE_SWITCHES=1
build_src_filter =
    -<*>
    +<bench_v2_main.cpp>
    +<bench_v2/>
    +<bench/>
    +<calibration/>
    +<app/>
    +<hardware/>
    +<interrupts/>
    +<motor/>
    +<sensors/>
    +<communication/>
    +<system/>
